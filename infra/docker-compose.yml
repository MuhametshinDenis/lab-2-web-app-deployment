services:
  client:
    image: ghcr.io/muhametshindenis/client-app:latest
    restart: always
    ports:
      - "4173:80"
    networks:
      - laba-network

  server:
    image: ghcr.io/muhametshindenis/fastapi-app:latest
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - laba-network

  database:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - laba-network

networks:
  laba-network:
    driver: bridge

volumes:
  postgres-data: